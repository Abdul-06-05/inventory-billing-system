{% extends "base.html" %}
{% block content %}
<h1>Purchases <a class="btn" href="{% url 'purchase_create' %}">+ Add Stock</a></h1>
<table>
  <tr><th>Date</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Cost price</th></tr>
  {% for p in purchases %}
  <tr><td>{{ p.date }}</td><td>{{ p.supplier }}</td><td>{{ p.product }}</td>
      <td>{{ p.quantity }}</td><td>₹{{ p.cost_price }}</td></tr>
  {% empty %}<tr><td colspan="5">No purchases yet.</td></tr>{% endfor %}
</table>
{% endblock %}
