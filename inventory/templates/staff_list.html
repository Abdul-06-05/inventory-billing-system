{% extends "base.html" %}
{% block content %}
<h1>Staff <a class="btn" href="{% url 'staff_create' %}">+ Add</a></h1>
<table>
  <tr><th>Username</th><th>Role</th></tr>
  {% for u in users %}
  <tr><td>{{ u.username }}</td>
      <td>{% if u.is_superuser %}admin (superuser){% else %}{{ u.profile.role|default:"-" }}{% endif %}</td></tr>
  {% endfor %}
</table>
{% endblock %}
